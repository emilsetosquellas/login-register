<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="enlace-icono">
                <img src="content/login.png" alt="Icono de mi cuenta" class="icono-png">
                <p>Iniciar sesión</p>
            </a>
        </nav>      
    </header>

    <main>
        <section>
            <h1>Registrarse</h1>
            <form method="post" action="" id="registro"> 

                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre" required>
              
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" name="apellido" placeholder="Ingrese su apellido" required>
                
                <label for="fecha-nacimiento">Fecha de Nacimiento</label>
                <input type="date" id="fecha-nacimiento" name="fecha_nacimiento" required>

                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="Ingrese su correo electrónico" required>
             
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required>
              
                <label for="confirmar-password">Confirmar Contraseña</label>
                <input type="password" id="confirmar-password" name="confirmar_password" placeholder="Confirme su contraseña" required>

                <button type="submit">Registrarse</button>
                <p>¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a></p>
            
            </form>
        </section>
    </main>

    <footer>
        <p>¡Síguenos en nuestras redes sociales!</p>
    </footer>
</body>
</html>
